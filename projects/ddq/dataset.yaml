dataset:

  coco:
    class: seallh.helpers.dataset.coco.COCODataset
    project: open
    name: COCO
    dataset_id: null
    local_copy_dir: 'datasets/COCO'
    instances:
      - split: train
        args: 
          split: train
          images_dir: train
          annotation_file: annotations/train.json
          single_class: true
      - split: validation
        args: 
          split: val
          images_dir: val
          annotation_file: annotations/val.json
          single_class: true
