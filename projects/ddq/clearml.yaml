# DDQ-specific ClearML configuration
clearml:
  # DDQ project identifier
  project_name: "sandbox/${project_name}"
  
  docker:
    image: "nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04"
    args:
      - --gpus
      - all
      - --shm-size=${oc.env:SEALLH_SHM_GB,${oc.env:SEALLH_SHM_GB,16}}g
      - --ipc=host
    env:
      - PYTHONUNBUFFERED=1
      - TZ=${oc.env:TZ,UTC}

    setup_bash_script:
      - apt-get update
      - apt-get install -y libgl1 libglib2.0-0 ninja-build

    env_extras:
      - SEALLH_PROJECT=${project_name}
      - SEALLH_CONFIG_NAME=main

  # Additional pip requirements for DDQ project
  pip:
    pip_extras:
      - --no-binary mmcv
      - mmcv==2.1.0
      - mmdet==3.3.0
      - timm==1.0.24
