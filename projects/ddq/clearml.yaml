# DDQ-specific ClearML configuration
clearml:
  # DDQ project identifier
  project_name: "sandbox/${project_name}"

  docker:
    image: "nvidia/cuda:12.6.3-cudnn-devel-ubuntu22.04"
    args:
      - --gpus
      - all
      - --shm-size=${oc.env:SEALLH_SHM_GB,${oc.env:SEALLH_SHM_GB,16}}g
      - --ipc=host
    env:
      - PYTHONUNBUFFERED=1
      - TZ=${oc.env:TZ,UTC}

    setup_bash_script:
      - apt-get update
      - apt-get install -y libgl1 libglib2.0-0 ninja-build

    env_extras:
      - SEALLH_PROJECT=${project_name}
      - SEALLH_CONFIG_NAME=main
      - MMCV_WITH_OPS=1
      - PIP_NO_BINARY=mmcv

  # pip requirements for DDQ project
  pip:
    requirements:
      - networkx==3.2.1
      - triton==3.2.0
      - torch==2.6.0
      - torchvision==0.21.0
      - pytorch-lightning
      - hydra-core
      - omegaconf
      - clearml
      - opencv-python-headless
      - tensorboardX
      - onnxruntime
      - onnxsim
      - onnxscript
      - pillow
      - mmcv==2.2.0
      - mmdet==3.3.0
      - timm==1.0.24
      - albumentations
      - faster-coco-eval==1.7.1
