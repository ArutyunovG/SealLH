# DDQ-specific ClearML configuration
clearml:
  # DDQ project identifier
  project_name: "sandbox/${project_name}"
  
  docker:
    image: ${oc.env:SEALLH_DOCKER_IMAGE,${oc.env:SEALLH_DOCKER_IMAGE,"nvidia/cuda:12.4.1-cudnn9-runtime-ubuntu22.04"}}
    args:
      - --gpus
      - all
      - --shm-size=${oc.env:SEALLH_SHM_GB,${oc.env:SEALLH_SHM_GB,16}}g
      - --ipc=host
    env:
      - PYTHONUNBUFFERED=1
      - TZ=${oc.env:TZ,UTC}

    env_extras:
      - SEALLH_PROJECT=${project_name}
      - SEALLH_CONFIG_NAME=main

  # Additional pip requirements for DDQ project
  pip:
    pip_extras:
      - mmcv==2.1.0
      - mmdet==3.3.0
      - timm==1.0.24
