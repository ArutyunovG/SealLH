transform:
  class: seallh.helpers.transform.sequential.Sequential
  args:
    transforms:
      - class: seallh.helpers.transform.resize.Resize
        args:
          height: ${get_idx:${input_shape},0}
          width: ${get_idx:${input_shape},1}

      - class: seallh.helpers.transform.normalize.Normalize
        args:
          mean: ${norm_mean}
          std: ${norm_std}

      - class: seallh.helpers.transform.normalize.ToTensor
        args: {}
